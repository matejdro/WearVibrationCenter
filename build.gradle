import nl.littlerobots.vcu.plugin.resolver.ModuleVersionCandidate

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://maven.google.com' }
        google()
        gradlePluginPortal()
    }
    dependencies {
        classpath libs.android.gradle
        classpath libs.kotlin.gradle
        classpath libs.versionsGradle
        classpath libs.dagger.hilt.gradlePlugin
        classpath libs.kotlinova.gradle


        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    alias(libs.plugins.versionCatalogUpdate)
}

boolean newlyContains(ModuleVersionCandidate self, String keyword) {
    return !self.currentVersion.contains(keyword) && self.candidate.version.contains(keyword)
}

versionCatalogUpdate {
    catalogFile.set(file("libs.toml"))

    // Custom version selection logic to exclude pre-release versions
    versionSelector {
        !newlyContains(it, "alpha") &&
        !newlyContains(it, "beta") &&
        !newlyContains(it, "Beta") &&
        !newlyContains(it, "RC") &&
        !newlyContains(it, "rc") &&
        !newlyContains(it, "M") &&
        !newlyContains(it, "eap") &&
        !newlyContains(it, "dev") &&
        !newlyContains(it, "pre")
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }

    apply plugin: "com.github.ben-manes.versions"


    tasks.named("dependencyUpdates").configure {
        rejectVersionIf {
            it.candidate.version.contains("alpha") ||
                    it.candidate.version.contains("beta") ||
                    it.candidate.version.contains("Beta") ||
                    it.candidate.version.contains("RC") ||
                    it.candidate.version.contains("rc") ||
                    it.candidate.version.contains("M")
        }

        reportfileName = "versions"
        outputFormatter = "json"
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
